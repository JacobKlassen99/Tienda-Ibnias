<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow border -->
  <rect x="12" y="12" width="488" height="488" rx="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Storefront / Building Icon with Ledger / Check -->
  <g transform="translate(96, 96)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Roof Awning -->
    <path d="M 20 90 L 160 30 L 300 90 L 280 120 L 240 120 L 220 90 L 180 90 L 160 120 L 140 120 L 120 90 L 80 90 L 60 120 L 40 120 Z" fill="url(#accentGrad)" stroke="#10b981" stroke-width="4"/>
    
    <!-- Store Pillars and Base -->
    <rect x="40" y="120" width="240" height="150" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#e2e8f0" stroke-width="12"/>
    
    <!-- Store Door -->
    <rect x="125" y="170" width="70" height="100" rx="6" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="8"/>
    
    <!-- Windows -->
    <rect x="60" y="150" width="45" height="50" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="#94a3b8" stroke-width="6"/>
    <rect x="215" y="150" width="45" height="50" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="#94a3b8" stroke-width="6"/>
    
    <!-- Currency / Check badge in lower right -->
    <circle cx="235" cy="235" r="42" fill="#059669" stroke="#ffffff" stroke-width="6"/>
    <!-- Bs text -->
    <text x="235" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Bs</text>
  </g>
</svg>
